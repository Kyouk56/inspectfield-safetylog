org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Production Release Signing Configuration.
# Never commit signing passwords here. Supply SAFETYLOG_KEYSTORE_PASSWORD and
# SAFETYLOG_KEY_PASSWORD via environment variables or CI secrets. A release build
# fails fast if the keystore or its credentials are missing.
SAFETYLOG_KEYSTORE_FILE=../keystore/safetylog-release.jks
SAFETYLOG_KEY_ALIAS=safetylog_release

# Server-authoritative authorization (see docs/SERVER_AUTHORIZATION.md).
# Supply both for any build that should enforce server-issued roles/entitlements.
AUTH_API_BASE_URL=https://safetylog-auth.safetylog-auth.workers.dev
AUTH_PUBLIC_KEY_SPKI_

